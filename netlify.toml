[build]
  # Tests run first: if any fail, the build stops and the live site keeps
  # serving the previous deploy.
  command = "npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Single-page app: every non-file path serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
